<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Poppins',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;background:linear-gradient(180deg,#0b1b3d 0%,#0d3b66 45%,#0e7490 80%,#14b8c4 100%) #0b1b3d;display:grid;place-items:center;padding:1.5rem;overflow-x:hidden}
.card{width:min(520px,100%);text-align:center;padding:clamp(2rem,6vw,3rem) clamp(1.5rem,5vw,2.5rem);border-radius:24px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 30px 70px -25px rgba(0,0,0,.6);animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.tick{width:104px;height:104px;margin:0 auto 1.6rem;border-radius:50%;border:4px solid #22d3ee;display:grid;place-items:center;box-shadow:0 0 0 8px rgba(34,211,238,.14),0 0 28px #22d3ee,0 0 70px rgba(34,211,238,.5);animation:pop .7s cubic-bezier(.2,.9,.3,1.3) .2s both}
.tick svg{width:54px;height:54px}
.tick path{fill:none;stroke:#22d3ee;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:50;animation:draw .6s ease .7s forwards}
h1{font-size:clamp(1.9rem,6vw,2.6rem);font-weight:700;letter-spacing:-.02em;margin-bottom:.6rem;animation:rise .8s .35s cubic-bezier(.2,.7,.2,1) both}
h1 span{color:#22d3ee}
p{color:#cfeaf5;line-height:1.75;font-size:1.02rem;animation:rise .8s .5s cubic-bezier(.2,.7,.2,1) both}
.btns{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;margin-top:2rem;animation:rise .8s .65s cubic-bezier(.2,.7,.2,1) both}
a{padding:.85rem 1.5rem;border-radius:12px;text-decoration:none;font-weight:600;font-size:.95rem;transition:transform .25s,box-shadow .25s,background .25s;-webkit-tap-highlight-color:transparent}
.p{background:#22d3ee;color:#06243a}
.g{border:1px solid rgba(255,255,255,.45);color:#fff}
@media (hover:hover){.p:hover{transform:translateY(-3px);box-shadow:0 10px 28px -8px rgba(34,211,238,.8)}.g:hover{background:rgba(255,255,255,.12);transform:translateY(-3px)}}
a:active{transform:scale(.96)}
.sig{margin-top:1.8rem;font-size:.85rem;color:#9fd3e6}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
